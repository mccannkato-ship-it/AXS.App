<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket Claim</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{margin:0;background:#030821;color:#fff}.container{max-width:400px;min-height:100vh;margin:auto;display:flex;flex-direction:column}.hidden{display:none!important}.top-gradient-bar{height:4px;background:linear-gradient(90deg,#1d70b8,#a855f7)}.header-title{text-align:center;font-size:14px;font-weight:700;padding:12px}.banner{background:#e8f1fb;color:#030821;padding:10px 16px;font-size:13px;font-weight:700}.banner span{font-weight:500;color:#556070}.main-content{padding:32px 20px 20px;text-align:center;flex:1}.hero-title{font-size:24px;font-weight:800;margin:0 0 6px}.sender-text{font-size:16px;font-weight:600;color:#c0cbdd;margin:0 0 24px}.description,.support-text{font-size:13px;color:#8da0b8;line-height:1.5}.description{margin:0 0 28px}.ticket-card{background:#0a1338;border-radius:12px;padding:12px;display:flex;align-items:center;text-align:left;margin-bottom:32px}.event-image{width:80px;height:80px;border-radius:8px;object-fit:cover;margin-right:12px}.event-meta{font-size:11px;font-weight:700;color:#8395a7;margin-bottom:4px;text-transform:uppercase}.event-title{font-size:15px;font-weight:800;line-height:1.2;margin-bottom:4px}.ticket-count{font-size:12px;color:#8395a7;font-weight:600}.support-text a{color:#3b82f6}.sticky-footer{position:sticky;bottom:0;background:#030821}.blue-accent-line{height:2px;background:#2563eb}.button-container{padding:16px 20px 24px;display:flex;gap:12px}.btn{flex:1;padding:14px 0;border-radius:24px;font-size:14px;font-weight:700;cursor:pointer}.btn-decline{background:transparent;border:1px solid #1d3557;color:#3b82f6}.btn-claim{background:#2563eb;border:0;color:#fff}.btn:disabled{opacity:.7;cursor:wait}.success-icon-box{width:64px;height:64px;background:#102a43;border:2px solid #2563eb;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;font-size:32px;color:#2563eb}.info-notice-box{background:#081230;border-left:4px solid #2563eb;padding:14px;border-radius:6px;text-align:left;margin-bottom:24px}.info-notice-box p{font-size:13px;color:#8da0b8;line-height:1.5;margin:0}
</style></head><body><main class="container" id="app"><div class="main-content">Loading claim…</div></main>
<script>
const app=document.querySelector('#app'), token=new URLSearchParams(location.search).get('token');
const esc=(value)=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
function ticketCard(claim){return `<div class="ticket-card"><img class="event-image" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=200&auto=format&fit=crop" alt="Event crowd"><div><div class="event-meta">AXS TICKET TRANSFER</div><div class="event-title">${esc(claim.eventName)}</div><div class="ticket-count">${esc(claim.ticketName)}</div></div></div>`}
function renderClaim(claim){app.innerHTML=`<section class="page-view"><div><div class="top-gradient-bar"></div><div class="header-title">Ticket Claim</div><div class="banner">Transfer link <span>Secure one-time claim</span></div><div class="main-content"><h1 class="hero-title">You received a ticket</h1><div class="sender-text">Ready to claim securely</div><p class="description">This claim link can only be used once. No password is requested or stored on this page.</p>${ticketCard(claim)}<div class="support-text">For assistance, contact <a href="mailto:guestservices@axs.com">guestservices@axs.com</a>.</div></div></div><div class="sticky-footer"><div class="blue-accent-line"></div><div class="button-container"><button class="btn btn-decline" id="decline">No, Thanks</button><button class="btn btn-claim" id="claim">Claim Ticket</button></div></div></section>`;document.querySelector('#decline').onclick=()=>{location.href='/'};document.querySelector('#claim').onclick=async()=>{const button=document.querySelector('#claim');button.disabled=true;button.textContent='Claiming…';const response=await fetch('/api/claim',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token})});const data=await response.json();if(!response.ok){button.disabled=false;button.textContent='Claim Ticket';alert(data.error||'Unable to claim ticket.');return}renderSuccess(data.claim)} }
function renderSuccess(claim){app.innerHTML=`<section class="page-view"><div><div class="top-gradient-bar"></div><div class="header-title">Transfer Confirmation</div><div class="main-content"><div class="success-icon-box">✓</div><h1 class="hero-title">Tickets Claimed Successfully!</h1><div class="sender-text">Your transfer is complete</div><div class="info-notice-box"><p>Your ticket has been claimed successfully. Open the AXS app to view your ticket and event details.</p></div>${ticketCard({eventName:claim.event_name||'Your event',ticketName:claim.ticket_name||'Ticket'})}</div></div><div class="sticky-footer"><div class="blue-accent-line"></div><div class="button-container"><button class="btn btn-claim" id="done">Done</button></div></div></section>`;document.querySelector('#done').onclick=()=>location.href='/' }
(async()=>{if(!token){app.innerHTML='<div class="main-content"><h1 class="hero-title">Invalid claim link</h1><p class="description">This link is missing its secure claim token.</p></div>';return}try { const response=await fetch('/api/claim?token='+encodeURIComponent(token)); const data=await response.json(); if(!response.ok){app.innerHTML='<div class="main-content"><h1 class="hero-title">Claim unavailable</h1><p class="description">This claim link is invalid, expired, or already used.</p></div>';return} data.claim.claimed?renderSuccess(data.claim):renderClaim(data.claim) } catch { app.innerHTML='<div class="main-content"><h1 class="hero-title">Claim unavailable</h1><p class="description">This claim link is invalid, expired, or already used.</p></div>' }})();
</script></body></html>
